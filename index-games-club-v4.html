<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MiniCuts Loyalty + Games Club</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D47A1;font-family:Arial,sans-serif}
#appFrame{border:0;width:100vw;height:100vh;display:block;background:#F0F4FF}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;z-index:999999;text-align:center}
#loader .box{background:rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#loader .panda{font-size:54px;margin-bottom:10px}
#loader .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px}
#loader .msg{font-size:14px;line-height:1.5;opacity:.9}
</style>
</head>
<body>
<div id="loader"><div class="box"><div class="panda">🐼</div><div class="title">MiniCuts Loyalty + Games Club</div><div class="msg">Loading fixed registration version...</div></div></div>
<iframe id="appFrame" src="./index.html?v=4"></iframe>
<script>
(function(){
  var frame=document.getElementById('appFrame');
  var loader=document.getElementById('loader');
  function injectFix(doc){
    if(doc.getElementById('lgcSafeRegFix'))return;
    var f=doc.createElement('script');
    f.id='lgcSafeRegFix';
    f.textContent="(function(){function q(id){return document.getElementById(id)}function dob(){var d=q('CRDOB_D'),m=q('CRDOB_M'),y=q('CRDOB_Y'),h=q('CRDOB');var v=(d&&m&&y&&d.value&&m.value&&y.value)?(y.value+'-'+m.value+'-'+d.value):(h?h.value:'');if(h)h.value=v;return v}function show(t,ok){var old=q('crMsg');if(old)old.remove();var box=document.querySelector('#CPA .cbox');if(!box)return;var div=document.createElement('div');div.id='crMsg';div.style.cssText='padding:10px;border-radius:10px;margin-bottom:12px;text-align:center;font-size:13px;font-weight:800;background:'+(ok?'#DCFCE7':'#FEE2E2')+';color:'+(ok?'#166534':'#DC2626');div.textContent=t;box.insertBefore(div,box.firstChild)}function patch(){if(typeof sb!=='function')return;window.custRegister=function(){var n=(q('CRN')&&q('CRN').value||'').trim(),p=(q('CRP')&&q('CRP').value||'').trim(),pa=(q('CRPR')&&q('CRPR').value||'').trim(),db=dob(),g=window.crG||'boy';if(!n){show('Please enter child name.',0);return}if(p.length<7){show('Please enter valid mobile number.',0);return}if(!db){show('Please select Day, Month and Year.',0);return}var b=document.querySelector('button[onclick=\"custRegister()\"]');if(b){b.disabled=true;b.style.opacity='.65';b.textContent='Creating account...'}sb('customers','GET',null,'select=*&mobile=eq.'+encodeURIComponent(p)+'&gender=eq.'+encodeURIComponent(g)+'&name=eq.'+encodeURIComponent(n)).then(function(ex){if(ex&&ex.length)return ex[0];return sb('customers','POST',{name:n,mobile:p,parent:pa,dob:db,gender:g,stamps:0,redemptions:0,first_stamp_date:null,expiry_date:null,game_points:0,game_spins:0})}).then(function(r){var c=Array.isArray(r)?r[0]:r;localStorage.setItem('mc_cust_mobile',p);var area=q('CPA');if(!area)return;area.innerHTML='<div style=\"background:#DCFCE7;border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;\"><div style=\"font-size:36px;margin-bottom:8px;\">🎉</div><div style=\"font-family:Baloo 2,cursive;font-size:18px;font-weight:800;color:#16A34A;\">Welcome, '+n+'!</div><div style=\"font-size:13px;color:#16A34A;margin-top:4px;\">Your Loyalty + Games Club account is ready.</div></div>'+(typeof buildCard==='function'?buildCard(c):'')+(typeof buildCustomerHistory==='function'?buildCustomerHistory([],c):'')+(typeof buildLookup==='function'?buildLookup(''):'')+(typeof buildFooter==='function'?buildFooter():'');if(typeof loadGameRanks==='function')loadGameRanks([c])}).catch(function(e){show('Registration error: '+(e&&e.message?e.message:'Please try again.'),0);if(b){b.disabled=false;b.style.opacity='1';b.textContent='Create Loyalty & Games Account 🐼'}})}}patch();setTimeout(patch,700);document.addEventListener('click',function(){setTimeout(patch,120)})})();";
    doc.body.appendChild(f);
  }
  frame.addEventListener('load',function(){
    var tries=0;
    var timer=setInterval(function(){
      tries++;
      try{
        var doc=frame.contentDocument||frame.contentWindow.document;
        if(!doc||!doc.body)return;
        if(!doc.getElementById('lgcTextPatch')){
          var s=doc.createElement('script');
          s.id='lgcTextPatch';
          s.src='./loyalty-games-club-text.js?v=4';
          doc.body.appendChild(s);
        }
        injectFix(doc);
        loader.style.display='none';
        clearInterval(timer);
      }catch(e){
        if(tries>40){clearInterval(timer);loader.textContent='Please refresh and try again.';}
      }
    },250);
  });
})();
</script>
</body>
</html>
