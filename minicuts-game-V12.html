<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MiniCuts Game Zone - V12 Stable Test</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D47A1;font-family:Arial,sans-serif;}
  #gameFrame{border:0;width:100vw;height:100vh;display:block;background:#0D47A1;}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;z-index:999999;text-align:center;}
  #loader .box{background:rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  #loader .panda{font-size:54px;margin-bottom:10px;}
  #loader .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px;}
  #loader .msg{font-size:14px;line-height:1.5;opacity:.9;}
</style>
</head>
<body>
<div id="loader">
  <div class="box">
    <div class="panda">🐼</div>
    <div class="title">Loading MiniCuts Game...</div>
    <div class="msg">Stable V12 test version</div>
  </div>
</div>
<iframe id="gameFrame" src="./minicuts-game-V10.html?v=18"></iframe>
<script>
(function(){
  const frame = document.getElementById('gameFrame');
  const loader = document.getElementById('loader');

  function patchGame(){
    const win = frame.contentWindow;
    const doc = frame.contentDocument || win.document;
    if(!win || !doc || !doc.body) return false;

    if(!doc.getElementById('v12PatchCss')){
      const style = doc.createElement('style');
      style.id = 'v12PatchCss';
      style.textContent = `
        .mem-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:6px!important;margin-bottom:8px!important;}
        .mem-card{aspect-ratio:1!important;border-radius:10px!important;font-size:28px!important;min-height:64px!important;}
        @keyframes v12pop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
      `;
      doc.head.appendChild(style);
    }

    win.regGender = win.regGender || 'boy';
    win.setRegGender = function(g){
      win.regGender = g;
      const boy = doc.getElementById('regBoy');
      const girl = doc.getElementById('regGirl');
      if(boy){ boy.style.borderColor = g === 'boy' ? '#FFD600' : '#E5E7EB'; boy.style.background = g === 'boy' ? '#FFF7CC' : '#fff'; }
      if(girl){ girl.style.borderColor = g === 'girl' ? '#FFD600' : '#E5E7EB'; girl.style.background = g === 'girl' ? '#FFF7CC' : '#fff'; }
    };
    win.showRegMsg = function(msg,ok){
      const el = doc.getElementById('regMsg');
      if(!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
      el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
    };
    win.showLoginMsg = function(msg,ok){
      const el = doc.getElementById('loginMsg');
      if(!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
      el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
    };

    Array.from(doc.querySelectorAll('button')).forEach(btn=>{
      if(btn.textContent && btn.textContent.includes('Register') && !btn.textContent.includes('Play')){
        btn.onclick = function(){ win.goToRegister('', '', 'Register below!'); };
      }
    });

    if(typeof win.buildMemGrid === 'function'){
      win.buildMemGrid = function(reveal){
        const emojis = ['🌟','🎡','🎈','🍭'];
        const pairs = [...emojis,...emojis].sort(()=>Math.random()-.5);
        try{ win.memCards = pairs; }catch(e){}
        const grid = doc.getElementById('memGrid');
        if(!grid) return;
        grid.innerHTML = pairs.map((e,i)=>'<div class="mem-card'+(reveal?' flipped':'')+'" id="mc'+i+'" onclick="flipCard('+i+')">'+(reveal?e:'🐼')+'</div>').join('');
      };
    }

    if(!doc.getElementById('v12SpinPatch')){
      const spinScript = doc.createElement('script');
      spinScript.id = 'v12SpinPatch';
      spinScript.textContent = `
(function(){
  try{
    function showSpinPointsPopup(earned){
      const old = document.getElementById('spinPointsPopup');
      if(old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'spinPointsPopup';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:22px;padding:24px 22px;max-width:300px;width:100%;text-align:center;animation:v12pop .28s ease-out;box-shadow:0 14px 40px rgba(0,0,0,.35);">'+
        '<div style="font-size:54px;margin-bottom:2px;">🎉</div>'+ 
        '<div style="font-family:Baloo 2, Nunito, sans-serif;font-size:22px;font-weight:900;color:#0D47A1;margin-bottom:2px;">Great Spin!</div>'+ 
        '<div style="font-family:Baloo 2, Nunito, sans-serif;font-size:50px;font-weight:900;color:#FF8C00;line-height:1;">+'+earned+'</div>'+ 
        '<div style="font-size:15px;font-weight:800;color:#1565C0;margin-top:5px;">points gained</div>'+ 
      '</div>';
      document.body.appendChild(overlay);
    }

    startSpin = function(){
      if(isSpinning) return;
      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      const panda = document.getElementById('pandaReact');
      if(spinBtn){ spinBtn.disabled = true; spinBtn.textContent = 'Spinning... 🎡'; spinBtn.onclick = null; }
      if(panda) panda.style.animation = 'jump 0.4s ease infinite';
      const startAngle = spinAngle || 0;
      const extraSpins = 6 + Math.random() * 4;
      const randomStop = Math.random() * 2 * Math.PI;
      const targetAngle = startAngle + extraSpins * 2 * Math.PI + randomStop;
      const duration = 4200;
      const startedAt = performance.now();
      let lastTick = 0;
      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function animate(now){
        const elapsed = now - startedAt;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);
        spinAngle = startAngle + (targetAngle - startAngle) * eased;
        drawWheel(spinAngle);
        if(now - lastTick > 120 && progress < 0.92){ lastTick = now; try{ soundSpin(); }catch(e){} }
        if(progress < 1){ requestAnimationFrame(animate); return; }
        spinAngle = targetAngle;
        drawWheel(spinAngle);
        isSpinning = false;
        if(panda) panda.style.animation = '';
        const n = SEGS.length;
        const arc = (2 * Math.PI) / n;
        const norm = ((spinAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const pointerAngle = -Math.PI / 2;
        const idx = Math.floor((((pointerAngle - norm) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / arc) % n;
        const earned = SEGS[idx].pts;
        bestSpinPts = earned;
        spinCount = 1;
        const best = document.getElementById('bestSoFar');
        const label = document.getElementById('spinChanceLabel');
        if(best) best.textContent = earned + 'pts';
        if(label) label.textContent = 'You won: ' + earned + ' pts!';
        if(panda) panda.textContent = earned >= 13 ? '🤩' : earned >= 11 ? '😄' : '😊';
        try{ soundSpinResult(earned); }catch(e){}
        if(spinBtn){ spinBtn.disabled = true; spinBtn.textContent = 'Saved ' + earned + ' pts! 🎉'; }
        showSpinPointsPopup(earned);
        const savePromise = savePoints(earned, 'spin').catch(function(e){ console.warn('Spin save failed:', e.message); });
        setTimeout(async function(){
          try{ await savePromise; }catch(e){}
          const old = document.getElementById('spinPointsPopup');
          if(old) old.remove();
          goProfile();
        }, 1150);
      }
      requestAnimationFrame(animate);
    };
    const btn = document.getElementById('spinBtn');
    if(btn){ btn.disabled = false; btn.textContent = 'SPIN! 🎡'; btn.onclick = startSpin; }
  }catch(e){
    const btn = document.getElementById('spinBtn');
    if(btn){ btn.disabled = false; btn.textContent = 'SPIN! 🎡'; }
    console.warn('V12 spin patch failed:', e.message);
  }
})();
      `;
      doc.body.appendChild(spinScript);
    }

    const spinBtn = doc.getElementById('spinBtn');
    if(spinBtn && spinBtn.textContent.includes('SPIN')) spinBtn.disabled = false;

    try{ win.setRegGender(win.regGender || 'boy'); }catch(e){}
    loader.style.display = 'none';
    return true;
  }

  frame.addEventListener('load', function(){
    let tries = 0;
    const timer = setInterval(function(){
      tries++;
      const ok = patchGame();
      if(ok || tries > 40) clearInterval(timer);
      if(tries > 40){
        loader.innerHTML = '<div class="box"><div class="panda">⚠️</div><div class="title">Unable to patch game</div><div class="msg">Please refresh and try again.</div></div>';
      }
    }, 250);
  });
})();
</script>
</body>
</html>
