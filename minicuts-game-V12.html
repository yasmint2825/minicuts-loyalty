<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MiniCuts Game Zone - V12 Stable Test</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D47A1;font-family:Arial,sans-serif;}
  #gameFrame{border:0;width:100vw;height:100vh;display:block;background:#0D47A1;}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;z-index:999999;text-align:center;}
  #loader .box{background:rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  #loader .panda{font-size:54px;margin-bottom:10px;}
  #loader .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px;}
  #loader .msg{font-size:14px;line-height:1.5;opacity:.9;}
</style>
</head>
<body>
<div id="loader">
  <div class="box">
    <div class="panda">🐼</div>
    <div class="title">Loading MiniCuts Game...</div>
    <div class="msg">Stable V12 test version</div>
  </div>
</div>
<iframe id="gameFrame" src="./minicuts-game-V10.html?v=23"></iframe>
<script>
(function(){
  const frame = document.getElementById('gameFrame');
  const loader = document.getElementById('loader');

  function patchGame(){
    const win = frame.contentWindow;
    const doc = frame.contentDocument || win.document;
    if(!win || !doc || !doc.body) return false;

    if(!doc.getElementById('v12PatchCss')){
      const style = doc.createElement('style');
      style.id = 'v12PatchCss';
      style.textContent = `
        .mem-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:6px!important;margin-bottom:8px!important;}
        .mem-card{aspect-ratio:1!important;border-radius:10px!important;font-size:28px!important;min-height:64px!important;}
        @keyframes v12pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
        @media(min-width:901px){
          .layout{display:block!important;width:100%!important;height:100vh!important;overflow:hidden!important;}
          .left-panel{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:210px!important;height:100vh!important;z-index:20!important;box-shadow:6px 0 18px rgba(0,0,0,.12)!important;}
          .lb-sidebar{position:fixed!important;right:0!important;top:0!important;bottom:0!important;width:250px!important;height:100vh!important;z-index:20!important;box-shadow:-6px 0 18px rgba(0,0,0,.12)!important;}
          .game-area{position:fixed!important;left:210px!important;right:250px!important;top:0!important;bottom:0!important;width:auto!important;height:100vh!important;display:flex!important;justify-content:center!important;align-items:flex-start!important;padding:10px 8px!important;overflow-y:auto!important;}
        }
        @media(max-width:900px){.game-area{left:0!important;right:0!important;}}
      `;
      doc.head.appendChild(style);
    }

    win.regGender = win.regGender || 'boy';
    win.setRegGender = function(g){
      win.regGender = g;
      const boy = doc.getElementById('regBoy');
      const girl = doc.getElementById('regGirl');
      if(boy){ boy.style.borderColor = g === 'boy' ? '#FFD600' : '#E5E7EB'; boy.style.background = g === 'boy' ? '#FFF7CC' : '#fff'; }
      if(girl){ girl.style.borderColor = g === 'girl' ? '#FFD600' : '#E5E7EB'; girl.style.background = g === 'girl' ? '#FFF7CC' : '#fff'; }
    };
    win.showRegMsg = function(msg,ok){
      const el = doc.getElementById('regMsg');
      if(!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
      el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
    };
    win.showLoginMsg = function(msg,ok){
      const el = doc.getElementById('loginMsg');
      if(!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
      el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
    };

    Array.from(doc.querySelectorAll('button')).forEach(btn=>{
      if(btn.textContent && btn.textContent.includes('Register') && !btn.textContent.includes('Play')){
        btn.onclick = function(){ win.goToRegister('', '', 'Register below!'); };
      }
    });

    if(!doc.getElementById('v12RankPatch')){
      const rankScript = doc.createElement('script');
      rankScript.id = 'v12RankPatch';
      rankScript.textContent = `
(function(){
  try{
    loadSidebarLb = async function(){
      try{
        const url = SB_URL + '/rest/v1/customers?select=id,name,mobile,game_points&order=game_points.desc&limit=1000';
        const res = await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const allRows = await res.json();
        const ranked = allRows.filter(function(c){ return (c.game_points||0)>0; });
        sidebarData = ranked.slice(0,10);
        const myPts = player.game_points || 0;
        const myRank = ranked.findIndex(function(c){
          if(player.id && c.id === player.id) return true;
          return String(c.mobile||'') === String(player.mobile||'') && String(c.name||'').trim().toLowerCase() === String(player.name||'').trim().toLowerCase();
        }) + 1;
        const rankEl = document.getElementById('sideRankBadge');
        if(rankEl){
          if(player.id && myPts>0 && myRank>0){
            rankEl.innerHTML = '<div class="rank-badge"><div class="rank-badge-txt">Your rank: #'+myRank+' of '+ranked.length+'</div><div style="font-size:10px;color:rgba(255,214,0,.7);">'+myPts+' pts total</div></div>';
          } else if(player.id && myPts>0){
            rankEl.innerHTML = '<div class="rank-badge"><div class="rank-badge-txt">Rank calculating...</div><div style="font-size:10px;color:rgba(255,214,0,.7);">'+myPts+' pts total</div></div>';
          } else {
            rankEl.innerHTML = '';
          }
        }
        const listEl = document.getElementById('sideLbList');
        if(!listEl) return;
        if(!sidebarData.length){
          listEl.innerHTML = '<div style="text-align:center;padding:16px;color:rgba(255,255,255,.35);font-size:11px;">No scores yet<br>Play to be first! 🎮</div>';
          return;
        }
        const medals=['🥇','🥈','🥉'];
        listEl.innerHTML = sidebarData.map(function(c,i){
          const pts = c.game_points || 0;
          const isMe = (player.id && c.id===player.id) || (String(c.mobile||'')===String(player.mobile||'') && String(c.name||'').trim().toLowerCase()===String(player.name||'').trim().toLowerCase());
          const icon = medals[i] || '#'+(i+1);
          return '<div style="display:flex;align-items:center;gap:7px;padding:7px 6px;margin-bottom:5px;border-radius:9px;background:'+(isMe?'rgba(255,214,0,.16)':'rgba(255,255,255,.055)')+';border:1px solid '+(isMe?'rgba(255,214,0,.35)':'rgba(255,255,255,.06)')+';">'+
            '<div style="font-size:15px;width:24px;text-align:center;font-weight:900;color:#FFD600;">'+icon+'</div>'+ 
            '<div style="flex:1;min-width:0;"><div class="sb-name">'+(c.name||'Player')+(isMe?' ⭐':'')+'</div><div class="sb-milestone">'+(i+1)+' of '+ranked.length+'</div></div>'+ 
            '<div class="sb-pts">'+pts+'</div>'+ 
          '</div>';
        }).join('');
      }catch(e){
        console.warn('Sidebar rank error:',e.message);
        const sEl=document.getElementById('sideLbList');
        if(sEl) sEl.innerHTML='<div style="text-align:center;padding:10px;color:rgba(255,100,100,.7);font-size:10px;">'+e.message+'</div>';
      }
    };
    renderSidebar = function(){ loadSidebarLb(); };
  }catch(e){ console.warn('V12 rank patch failed:', e.message); }
})();
      `;
      doc.body.appendChild(rankScript);
    }

    if(!doc.getElementById('v12RegisterPatch')){
      const regScript = doc.createElement('script');
      regScript.id = 'v12RegisterPatch';
      regScript.textContent = `
(function(){
  try{
    doRegister = async function(){
      const name=document.getElementById('regName').value.trim();
      const mobile=document.getElementById('regMobile').value.trim();
      const parent=document.getElementById('regParent').value.trim();
      const dobDay=document.getElementById('dobDay').value;
      const dobMonth=document.getElementById('dobMonth').value;
      const dobYear=document.getElementById('dobYear').value;
      const dob=(dobYear&&dobMonth&&dobDay)?(dobYear+'-'+dobMonth+'-'+dobDay):null;
      const gender = window.regGender || 'boy';
      const msg=document.getElementById('regMsg');
      if(msg) msg.style.display='none';
      if(!name){showRegMsg("Please enter child's name",false);return;}
      if(mobile.length<7){showRegMsg('Please enter valid parent mobile',false);return;}
      if(!dob){showRegMsg('Date of birth is required! 🎂',false);return;}
      if(!gender){showRegMsg('Please select Boy or Girl',false);return;}
      const btn=document.querySelector('#s-register .btn-y');
      if(btn){btn.disabled=true;btn.style.opacity='0.65';btn.style.pointerEvents='none';btn.textContent='Registering... 🐼';}
      try{
        const res=await sb('customers','POST',{name,mobile,parent,dob,gender,stamps:0,redemptions:0,game_points:0,game_spins:0});
        player=Array.isArray(res)?res[0]:res;player.game_points=0;player.game_spins=0;
        showRegMsg('Welcome to MiniCuts! 🎉','ok');
        if(btn){ btn.textContent='Starting game... 🎮'; }
        spinCount=0;bestSpinPts=0;
        await checkTodaySessions();await fetchGlobalBests();setTimeout(()=>goProfile(),450);
      }catch(e){
        showRegMsg('Error: '+e.message,false);
        if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.pointerEvents='auto';btn.textContent='Register & Play! 🎮';}
      }
    };
  }catch(e){ console.warn('V12 registration patch failed:', e.message); }
})();
      `;
      doc.body.appendChild(regScript);
    }

    if(!doc.getElementById('v12PointsPatch')){
      const ptsScript = doc.createElement('script');
      ptsScript.id = 'v12PointsPatch';
      ptsScript.textContent = `
(function(){
  try{ saveAndShowResult = async function(pts, gameType){ showResult(pts); }; }
  catch(e){ console.warn('V12 points patch failed:', e.message); }
})();
      `;
      doc.body.appendChild(ptsScript);
    }

    if(!doc.getElementById('v12MemoryPatch')){
      const memScript = doc.createElement('script');
      memScript.id = 'v12MemoryPatch';
      memScript.textContent = `
(function(){
  try{
    buildMemGrid = function(reveal){
      const symbols = ['🌟','🎡','🎈','🍭'];
      const pairs = symbols.concat(symbols).sort(function(){return Math.random()-.5;});
      memCards = pairs;
      const grid = document.getElementById('memGrid');
      if(!grid) return;
      grid.innerHTML = pairs.map(function(e,i){ return '<div class="mem-card'+(reveal?' flipped':'')+'" id="mc'+i+'" onclick="flipCard('+i+')">'+(reveal?e:'🐼')+'</div>'; }).join('');
    };
  }catch(e){ console.warn('V12 memory patch failed:', e.message); }
})();
      `;
      doc.body.appendChild(memScript);
    }

    if(!doc.getElementById('v12SpinPatch')){
      const spinScript = doc.createElement('script');
      spinScript.id = 'v12SpinPatch';
      spinScript.textContent = `
(function(){
  try{
    function showSpinPointsPopup(earned){
      const old = document.getElementById('spinPointsPopup');if(old) old.remove();
      const overlay = document.createElement('div');overlay.id = 'spinPointsPopup';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:20px;padding:22px 22px;max-width:290px;width:100%;text-align:center;animation:v12pop .16s ease-out;box-shadow:0 14px 40px rgba(0,0,0,.35);"><div style="font-size:46px;margin-bottom:0;">🎉</div><div style="font-family:Baloo 2, Nunito, sans-serif;font-size:20px;font-weight:900;color:#0D47A1;margin-bottom:0;">Great Spin!</div><div style="font-family:Baloo 2, Nunito, sans-serif;font-size:46px;font-weight:900;color:#FF8C00;line-height:1;">+'+earned+'</div><div style="font-size:14px;font-weight:800;color:#1565C0;margin-top:4px;">points gained</div></div>';
      document.body.appendChild(overlay);
    }
    startSpin = function(){
      if(isSpinning) return;isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');const panda = document.getElementById('pandaReact');
      if(spinBtn){ spinBtn.disabled = true; spinBtn.textContent = 'Spinning... 🎡'; spinBtn.onclick = null; }
      if(panda) panda.style.animation = 'jump 0.4s ease infinite';
      const startAngle = spinAngle || 0;const extraSpins = 6 + Math.random() * 4;const randomStop = Math.random() * 2 * Math.PI;
      const targetAngle = startAngle + extraSpins * 2 * Math.PI + randomStop;const duration = 4200;const startedAt = performance.now();let lastTick = 0;
      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function animate(now){
        const elapsed = now - startedAt;const progress = Math.min(elapsed / duration, 1);const eased = easeOutCubic(progress);
        spinAngle = startAngle + (targetAngle - startAngle) * eased;drawWheel(spinAngle);
        if(now - lastTick > 120 && progress < 0.92){ lastTick = now; try{ soundSpin(); }catch(e){} }
        if(progress < 1){ requestAnimationFrame(animate); return; }
        spinAngle = targetAngle;drawWheel(spinAngle);isSpinning = false;if(panda) panda.style.animation = '';
        const n = SEGS.length;const arc = (2 * Math.PI) / n;const norm = ((spinAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const pointerAngle = -Math.PI / 2;const idx = Math.floor((((pointerAngle - norm) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / arc) % n;
        const earned = SEGS[idx].pts;bestSpinPts = earned;spinCount = 1;
        const best = document.getElementById('bestSoFar');const label = document.getElementById('spinChanceLabel');
        if(best) best.textContent = earned + 'pts';if(label) label.textContent = 'You won: ' + earned + ' pts!';
        if(panda) panda.textContent = earned >= 13 ? '🤩' : earned >= 11 ? '😄' : '😊';try{ soundSpinResult(earned); }catch(e){}
        if(spinBtn){ spinBtn.disabled = true; spinBtn.textContent = 'Saved ' + earned + ' pts! 🎉'; }
        showSpinPointsPopup(earned);savePoints(earned, 'spin').catch(function(e){ console.warn('Spin save failed:', e.message); });
        setTimeout(function(){const old = document.getElementById('spinPointsPopup');if(old) old.remove();goProfile();}, 450);
      }
      requestAnimationFrame(animate);
    };
    const btn = document.getElementById('spinBtn');if(btn){ btn.disabled = false; btn.textContent = 'SPIN! 🎡'; btn.onclick = startSpin; }
  }catch(e){const btn = document.getElementById('spinBtn');if(btn){ btn.disabled = false; btn.textContent = 'SPIN! 🎡'; }console.warn('V12 spin patch failed:', e.message);}
})();
      `;
      doc.body.appendChild(spinScript);
    }

    const spinBtn = doc.getElementById('spinBtn');
    if(spinBtn && spinBtn.textContent.includes('SPIN')) spinBtn.disabled = false;

    try{ win.setRegGender(win.regGender || 'boy'); }catch(e){}
    loader.style.display = 'none';
    return true;
  }

  frame.addEventListener('load', function(){
    let tries = 0;
    const timer = setInterval(function(){
      tries++;
      const ok = patchGame();
      if(ok || tries > 40) clearInterval(timer);
      if(tries > 40){loader.innerHTML = '<div class="box"><div class="panda">⚠️</div><div class="title">Unable to patch game</div><div class="msg">Please refresh and try again.</div></div>';}
    }, 250);
  });
})();
</script>
</body>
</html>
