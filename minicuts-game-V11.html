<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MiniCuts Game Zone - Fixed Test</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:24px;}
  .box{max-width:420px;background:rgba(255,255,255,.12);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .panda{font-size:54px;margin-bottom:10px;}
  .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px;}
  .msg{font-size:14px;line-height:1.5;opacity:.9;}
</style>
</head>
<body>
<div class="box">
  <div class="panda">🐼</div>
  <div class="title">Loading MiniCuts Game...</div>
  <div class="msg">Applying registration, memory and spin hotfix safely.</div>
</div>
<script>
(async function(){
  try{
    const response = await fetch('./minicuts-game-V10.html?v=' + Date.now(), {cache:'no-store'});
    if(!response.ok) throw new Error('Could not load V10 file: HTTP ' + response.status);
    let html = await response.text();

    html = html.replace(
      'onclick="goToRegister(\\\'\\\',\\\'\\\',\\\'Register below!\\\')"',
      'onclick="goToRegister(\'\', \'\', \'Register below!\')"'
    );

    html = html.replace(
      'if(!name){showRegMsg("Please enter child\'s name",false);return;}\n   \n   if(!dob){',
      'if(!name){showRegMsg("Please enter child\'s name",false);return;}\n   if(mobile.length<7){showRegMsg("Please enter valid parent mobile",false);return;}\n   \n   if(!dob){'
    );

    html = html.replace(
      ".mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}",
      ".mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}"
    );
    html = html.replace(
      ".mem-card{aspect-ratio:1;background:var(--b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:transform .2s;border:2px solid rgba(255,255,255,.15);}",
      ".mem-card{aspect-ratio:1;background:var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:transform .2s;border:2px solid rgba(255,255,255,.15);min-height:64px;}"
    );
    html = html.replace(
      "const MEM_EMOJIS=['🐼','🌟','🎡','🎈','🍭','🚀','🎮','🦁'];",
      "const MEM_EMOJIS=['🌟','🎡','🎈','🍭','🚀','🎮','🦁','✂️'];"
    );

    const helperScript = `
window.regGender = window.regGender || 'boy';
function setRegGender(g){
  window.regGender = g;
  try{ regGender = g; }catch(e){}
  var boy = document.getElementById('regBoy');
  var girl = document.getElementById('regGirl');
  if(boy){ boy.style.borderColor = g === 'boy' ? '#FFD600' : '#E5E7EB'; boy.style.background = g === 'boy' ? '#FFF7CC' : '#fff'; }
  if(girl){ girl.style.borderColor = g === 'girl' ? '#FFD600' : '#E5E7EB'; girl.style.background = g === 'girl' ? '#FFF7CC' : '#fff'; }
}
function showRegMsg(msg,ok){
  var el = document.getElementById('regMsg');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
  el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
}
function showLoginMsg(msg,ok){
  var el = document.getElementById('loginMsg');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = ok === 'ok' || ok === true ? '#DCFCE7' : '#FEE2E2';
  el.style.color = ok === 'ok' || ok === true ? '#166534' : '#DC2626';
}
`;

    const spinOverride = `
function startSpin(){
  if(isSpinning) return;
  isSpinning = true;
  const spinBtn = document.getElementById('spinBtn');
  const panda = document.getElementById('pandaReact');
  spinBtn.disabled = true;
  spinBtn.textContent = 'Spinning... 🎡';
  spinBtn.onclick = null;
  if(panda) panda.style.animation = 'jump 0.4s ease infinite';
  const startAngle = spinAngle || 0;
  const extraSpins = 6 + Math.random() * 4;
  const randomStop = Math.random() * 2 * Math.PI;
  const targetAngle = startAngle + extraSpins * 2 * Math.PI + randomStop;
  const duration = 4200;
  const startedAt = performance.now();
  let lastTick = 0;
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function animate(now){
    const elapsed = now - startedAt;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(progress);
    spinAngle = startAngle + (targetAngle - startAngle) * eased;
    drawWheel(spinAngle);
    if(now - lastTick > 120 && progress < 0.92){ lastTick = now; soundSpin(); }
    if(progress < 1){ requestAnimationFrame(animate); return; }
    spinAngle = targetAngle;
    drawWheel(spinAngle);
    isSpinning = false;
    if(panda) panda.style.animation = '';
    const n = SEGS.length;
    const arc = (2 * Math.PI) / n;
    const norm = ((spinAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const idx = Math.floor(((2 * Math.PI - norm + Math.PI / 2) % (2 * Math.PI)) / arc) % n;
    const earned = SEGS[idx].pts;
    bestSpinPts = earned;
    spinCount = 1;
    document.getElementById('bestSoFar').textContent = earned + 'pts';
    document.getElementById('spinChanceLabel').textContent = 'You won: ' + earned + ' pts! Saving...';
    if(panda) panda.textContent = earned >= 13 ? '🤩' : earned >= 11 ? '😄' : '😊';
    soundSpinResult(earned);
    spinBtn.disabled = true;
    spinBtn.textContent = 'Saved ' + earned + ' pts! 🎉';
    saveAndShowResult(earned, 'spin');
  }
  requestAnimationFrame(animate);
}
`;

    if(html.includes('window.onerror')){
      html = html.replace('window.onerror', helperScript + '\nwindow.onerror');
    } else {
      html = html.replace('<script>', '<script>\n' + helperScript);
    }

    const closeScript = '<' + '/script>';
    const endNeedle = '\n' + closeScript + '\n</body>';
    html = html.replace(endNeedle, '\n' + spinOverride + endNeedle);
    html = html.replace('<title>MiniCuts Game Zone 🐼</title>','<title>MiniCuts Game Zone 🐼 - Fixed Test</title>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML = '<div style="max-width:420px;background:#fff;color:#DC2626;border-radius:18px;padding:24px;font-family:Arial,sans-serif;text-align:center;"><div style="font-size:46px;">⚠️</div><h2>Unable to load game</h2><p>'+error.message+'</p></div>';
  }
})();
</script>
</body>
</html>
