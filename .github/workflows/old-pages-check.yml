# Opens the live old salon pages every morning and fails (GitHub e-mails a failure notice) if one of them
# stops working: a script error, a refused or failed database read, or no salon data where there should be.
# READ-ONLY: tests/live_check.js stops every request that could change data before it leaves the browser.
name: Old pages daily check

on:
  schedule:
    - cron: '30 3 * * *'   # 07:30 Dubai, before the salon opens
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: old-pages-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check the live pages
        run: node tests/live_check.js
