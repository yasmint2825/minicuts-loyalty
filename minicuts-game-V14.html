<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MiniCuts Game Zone - V14 Global Rank</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D47A1;font-family:Arial,sans-serif;}
  #gameFrame{border:0;width:100vw;height:100vh;display:block;background:#0D47A1;}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;z-index:999999;text-align:center;}
  #loader .box{background:rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  #loader .panda{font-size:54px;margin-bottom:10px;}
  #loader .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px;}
  #loader .msg{font-size:14px;line-height:1.5;opacity:.9;}
</style>
</head>
<body>
<div id="loader"><div class="box"><div class="panda">🐼</div><div class="title">Loading MiniCuts Game...</div><div class="msg">V14 global ranking version</div></div></div>
<iframe id="gameFrame" src="./minicuts-game-V10.html?v=25"></iframe>
<script>
(function(){
  const frame=document.getElementById('gameFrame');
  const loader=document.getElementById('loader');

  function patchGame(){
    const win=frame.contentWindow;
    const doc=frame.contentDocument||win.document;
    if(!win||!doc||!doc.body) return false;

    if(!doc.getElementById('v14PatchCss')){
      const style=doc.createElement('style');
      style.id='v14PatchCss';
      style.textContent=`
        .mem-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:6px!important;margin-bottom:8px!important;}
        .mem-card{aspect-ratio:1!important;border-radius:10px!important;font-size:28px!important;min-height:64px!important;}
        @keyframes v14pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
        @media(min-width:901px){
          .layout{display:block!important;width:100%!important;height:100vh!important;overflow:hidden!important;}
          .left-panel{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:210px!important;height:100vh!important;z-index:20!important;box-shadow:6px 0 18px rgba(0,0,0,.12)!important;}
          .lb-sidebar{position:fixed!important;right:0!important;top:0!important;bottom:0!important;width:250px!important;height:100vh!important;z-index:20!important;box-shadow:-6px 0 18px rgba(0,0,0,.12)!important;}
          .game-area{position:fixed!important;left:210px!important;right:250px!important;top:0!important;bottom:0!important;width:auto!important;height:100vh!important;display:flex!important;justify-content:center!important;align-items:flex-start!important;padding:10px 8px!important;overflow-y:auto!important;}
        }
      `;
      doc.head.appendChild(style);
    }

    win.regGender=win.regGender||'boy';
    win.setRegGender=function(g){
      win.regGender=g;
      const boy=doc.getElementById('regBoy');
      const girl=doc.getElementById('regGirl');
      if(boy){boy.style.borderColor=g==='boy'?'#FFD600':'#E5E7EB';boy.style.background=g==='boy'?'#FFF7CC':'#fff';}
      if(girl){girl.style.borderColor=g==='girl'?'#FFD600':'#E5E7EB';girl.style.background=g==='girl'?'#FFF7CC':'#fff';}
    };
    win.showRegMsg=function(msg,ok){
      const el=doc.getElementById('regMsg'); if(!el) return;
      el.textContent=msg;el.style.display='block';el.style.background=(ok==='ok'||ok===true)?'#DCFCE7':'#FEE2E2';el.style.color=(ok==='ok'||ok===true)?'#166534':'#DC2626';
    };
    win.showLoginMsg=function(msg,ok){
      const el=doc.getElementById('loginMsg'); if(!el) return;
      el.textContent=msg;el.style.display='block';el.style.background=(ok==='ok'||ok===true)?'#DCFCE7':'#FEE2E2';el.style.color=(ok==='ok'||ok===true)?'#166534':'#DC2626';
    };

    Array.from(doc.querySelectorAll('button')).forEach(btn=>{
      if(btn.textContent&&btn.textContent.includes('Register')&&!btn.textContent.includes('Play')){
        btn.onclick=function(){win.goToRegister('', '', 'Register below!');};
      }
    });

    function injectScript(id,code){
      if(doc.getElementById(id)) return;
      const s=doc.createElement('script');s.id=id;s.textContent=code;doc.body.appendChild(s);
    }

    injectScript('v14RankPatch', `
(function(){
  try{
    async function getExactCount(url){
      const res=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'count=exact'},method:'GET'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const cr=res.headers.get('content-range')||'';
      const total=parseInt((cr.split('/')[1]||'0'),10);
      return isNaN(total)?0:total;
    }
    async function refreshCurrentPlayer(){
      if(!player||!player.id) return player;
      try{
        const rows=await sb('customers','GET',null,'select=id,name,mobile,game_points,best_memory_time&id=eq.'+encodeURIComponent(player.id)+'&limit=1');
        if(rows&&rows.length){player=Object.assign(player,rows[0]);}
      }catch(e){}
      return player;
    }
    async function calculateGlobalRank(){
      await refreshCurrentPlayer();
      if(!player||!player.id) return null;
      const pts=Number(player.game_points||0);
      const greaterUrl=SB_URL+'/rest/v1/customers?select=id&game_points=gt.'+pts+'&limit=1';
      const totalUrl=SB_URL+'/rest/v1/customers?select=id&game_points=not.is.null&limit=1';
      const greater=await getExactCount(greaterUrl);
      const total=await getExactCount(totalUrl);
      return {rank:greater+1,total:Math.max(total,1),points:pts};
    }
    async function renderGlobalRank(){
      const rankEl=document.getElementById('sideRankBadge');
      if(!rankEl||!player||!player.id) return;
      rankEl.innerHTML='<div class="rank-badge"><div class="rank-badge-txt">Calculating global rank...</div></div>';
      try{
        const r=await calculateGlobalRank();
        if(r){
          rankEl.innerHTML='<div class="rank-badge"><div class="rank-badge-txt">Global rank: #'+r.rank+' of '+r.total+'</div><div style="font-size:10px;color:rgba(255,214,0,.7);">'+r.points+' pts total</div></div>';
        }
      }catch(e){
        rankEl.innerHTML='<div class="rank-badge"><div class="rank-badge-txt">Rank unavailable</div><div style="font-size:10px;color:rgba(255,214,0,.7);">Refresh after playing</div></div>';
        console.warn('Global rank error:',e.message);
      }
    }
    loadSidebarLb=async function(){
      try{
        await refreshCurrentPlayer();
        const rows=await sb('customers','GET',null,'select=id,name,mobile,game_points&order=game_points.desc&limit=10');
        sidebarData=rows||[];
        const listEl=document.getElementById('sideLbList');
        if(listEl){
          if(!sidebarData.length){listEl.innerHTML='<div style="text-align:center;padding:16px;color:rgba(255,255,255,.35);font-size:11px;">No scores yet<br>Play to be first! 🎮</div>';}
          else{
            const medals=['🥇','🥈','🥉'];
            listEl.innerHTML=sidebarData.map(function(c,i){
              const pts=c.game_points||0;
              const isMe=(player.id&&c.id===player.id)||(String(c.mobile||'')===String(player.mobile||'')&&String(c.name||'').trim().toLowerCase()===String(player.name||'').trim().toLowerCase());
              const icon=medals[i]||'#'+(i+1);
              return '<div style="display:flex;align-items:center;gap:7px;padding:7px 6px;margin-bottom:5px;border-radius:9px;background:'+(isMe?'rgba(255,214,0,.16)':'rgba(255,255,255,.055)')+';border:1px solid '+(isMe?'rgba(255,214,0,.35)':'rgba(255,255,255,.06)')+';"><div style="font-size:15px;width:24px;text-align:center;font-weight:900;color:#FFD600;">'+icon+'</div><div style="flex:1;min-width:0;"><div class="sb-name">'+(c.name||'Player')+(isMe?' ⭐':'')+'</div><div class="sb-milestone">Top 10</div></div><div class="sb-pts">'+pts+'</div></div>';
            }).join('');
          }
        }
        renderGlobalRank();
      }catch(e){console.warn('Sidebar error:',e.message);renderGlobalRank();}
    };
    renderSidebar=function(){loadSidebarLb();};
    const oldGoProfile=goProfile;
    goProfile=function(){oldGoProfile();setTimeout(renderGlobalRank,350);};
    setTimeout(renderGlobalRank,800);
  }catch(e){console.warn('V14 rank patch failed:',e.message);}
})();
    `);

    injectScript('v14RegisterPatch', `
(function(){try{doRegister=async function(){
  const name=document.getElementById('regName').value.trim();const mobile=document.getElementById('regMobile').value.trim();const parent=document.getElementById('regParent').value.trim();
  const d=document.getElementById('dobDay').value,m=document.getElementById('dobMonth').value,y=document.getElementById('dobYear').value;const dob=(y&&m&&d)?(y+'-'+m+'-'+d):null;const gender=window.regGender||'boy';
  const msg=document.getElementById('regMsg');if(msg)msg.style.display='none';
  if(!name){showRegMsg("Please enter child's name",false);return;}if(mobile.length<7){showRegMsg('Please enter valid parent mobile',false);return;}if(!dob){showRegMsg('Date of birth is required! 🎂',false);return;}
  const btn=document.querySelector('#s-register .btn-y');if(btn){btn.disabled=true;btn.style.opacity='0.65';btn.style.pointerEvents='none';btn.textContent='Registering... 🐼';}
  try{const res=await sb('customers','POST',{name,mobile,parent,dob,gender,stamps:0,redemptions:0,game_points:0,game_spins:0});player=Array.isArray(res)?res[0]:res;player.game_points=0;player.game_spins=0;showRegMsg('Welcome to MiniCuts! 🎉','ok');if(btn)btn.textContent='Starting game... 🎮';spinCount=0;bestSpinPts=0;await checkTodaySessions();await fetchGlobalBests();setTimeout(()=>goProfile(),450);}catch(e){showRegMsg('Error: '+e.message,false);if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.pointerEvents='auto';btn.textContent='Register & Play! 🎮';}}
};}catch(e){console.warn('V14 registration patch failed:',e.message);}})();
    `);

    injectScript('v14PointsPatch', `(function(){try{saveAndShowResult=async function(pts,gameType){showResult(pts);};}catch(e){console.warn('V14 points patch failed:',e.message);}})();`);

    injectScript('v14MemoryPatch', `
(function(){try{
  buildMemGrid=function(reveal){const symbols=['🌟','🎡','🎈','🍭'];const pairs=symbols.concat(symbols).sort(function(){return Math.random()-.5;});memCards=pairs;const grid=document.getElementById('memGrid');if(!grid)return;grid.innerHTML=pairs.map(function(e,i){return '<div class="mem-card'+(reveal?' flipped':'')+'" id="mc'+i+'" onclick="flipCard('+i+')">'+(reveal?e:'🐼')+'</div>';}).join('');};
  endMemory=async function(){clearInterval(memTimerInt);memStarted=false;let globalBestTime=null,globalBestName=null;try{const r=await fetch(SB_URL+'/rest/v1/customers?select=name,best_memory_time&best_memory_time=not.is.null&order=best_memory_time.asc&limit=50',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});const rows=await r.json();const best=(Array.isArray(rows)?rows:[]).filter(c=>Number(c.best_memory_time)>0).sort((a,b)=>Number(a.best_memory_time)-Number(b.best_memory_time))[0];if(best){globalBestTime=Number(best.best_memory_time);globalBestName=best.name;}}catch(e){if(globalBestMemory&&globalBestMemory.time){globalBestTime=Number(globalBestMemory.time);globalBestName=globalBestMemory.name;}}
    const isGlobalBest=!globalBestTime||memSeconds<globalBestTime;const isPersonalBest=!player.best_memory_time||memSeconds<Number(player.best_memory_time);const pts=8+(isGlobalBest?2:0);if(isPersonalBest)player.best_memory_time=memSeconds;if(isGlobalBest)globalBestMemory={time:memSeconds,name:player.name};
    const hintEl=document.getElementById('memBestHint');if(hintEl){hintEl.style.display='block';if(isGlobalBest){hintEl.innerHTML='<span style="font-size:18px;font-weight:900;">🏆 NEW ALL-TIME RECORD: '+memSeconds+'s!</span><br><span style="font-size:14px;">Fastest among all players. +2 bonus!</span>';hintEl.style.background='rgba(22,163,74,.2)';hintEl.style.borderColor='rgba(22,163,74,.5)';hintEl.style.color='#4ADE80';}else{hintEl.innerHTML='<span style="font-size:16px;font-weight:900;">⏱️ Your time: '+memSeconds+'s</span><br><span style="font-size:13px;">All-time best is <strong>'+globalBestTime+'s</strong>'+(globalBestName?' by '+globalBestName:'')+'. Earned 8 pts.</span>';hintEl.style.background='rgba(255,214,0,.15)';hintEl.style.borderColor='rgba(255,214,0,.3)';hintEl.style.color='var(--y)';}}
    const btn=document.getElementById('memStartBtn');if(btn){btn.style.display='block';btn.textContent='See my '+pts+' pts! 🎉';btn.disabled=false;btn.onclick=function(){saveAndShowResult(pts,'memory');};}savePoints(pts,'memory',isPersonalBest?memSeconds:null);
  };
}catch(e){console.warn('V14 memory patch failed:',e.message);}})();
    `);

    injectScript('v14SpinPatch', `
(function(){try{
  function showSpinPointsPopup(earned){const old=document.getElementById('spinPointsPopup');if(old)old.remove();const overlay=document.createElement('div');overlay.id='spinPointsPopup';overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';overlay.innerHTML='<div style="background:#fff;border-radius:20px;padding:22px 22px;max-width:290px;width:100%;text-align:center;animation:v14pop .16s ease-out;box-shadow:0 14px 40px rgba(0,0,0,.35);"><div style="font-size:46px;margin-bottom:0;">🎉</div><div style="font-family:Baloo 2, Nunito, sans-serif;font-size:20px;font-weight:900;color:#0D47A1;margin-bottom:0;">Great Spin!</div><div style="font-family:Baloo 2, Nunito, sans-serif;font-size:46px;font-weight:900;color:#FF8C00;line-height:1;">+'+earned+'</div><div style="font-size:14px;font-weight:800;color:#1565C0;margin-top:4px;">points gained</div></div>';document.body.appendChild(overlay);}
  startSpin=function(){if(isSpinning)return;isSpinning=true;const spinBtn=document.getElementById('spinBtn');const panda=document.getElementById('pandaReact');if(spinBtn){spinBtn.disabled=true;spinBtn.textContent='Spinning... 🎡';spinBtn.onclick=null;}if(panda)panda.style.animation='jump 0.4s ease infinite';const startAngle=spinAngle||0;const targetAngle=startAngle+(6+Math.random()*4)*2*Math.PI+Math.random()*2*Math.PI;const duration=4200;const startedAt=performance.now();let lastTick=0;function easeOutCubic(t){return 1-Math.pow(1-t,3);}function animate(now){const progress=Math.min((now-startedAt)/duration,1);spinAngle=startAngle+(targetAngle-startAngle)*easeOutCubic(progress);drawWheel(spinAngle);if(now-lastTick>120&&progress<0.92){lastTick=now;try{soundSpin();}catch(e){}}if(progress<1){requestAnimationFrame(animate);return;}spinAngle=targetAngle;drawWheel(spinAngle);isSpinning=false;if(panda)panda.style.animation='';const arc=(2*Math.PI)/SEGS.length;const norm=((spinAngle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);const idx=Math.floor((((-Math.PI/2-norm)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/arc)%SEGS.length;const earned=SEGS[idx].pts;bestSpinPts=earned;spinCount=1;const best=document.getElementById('bestSoFar');const label=document.getElementById('spinChanceLabel');if(best)best.textContent=earned+'pts';if(label)label.textContent='You won: '+earned+' pts!';if(panda)panda.textContent=earned>=13?'🤩':earned>=11?'😄':'😊';try{soundSpinResult(earned);}catch(e){}if(spinBtn){spinBtn.disabled=true;spinBtn.textContent='Saved '+earned+' pts! 🎉';}showSpinPointsPopup(earned);savePoints(earned,'spin').catch(e=>console.warn('Spin save failed:',e.message));setTimeout(function(){const old=document.getElementById('spinPointsPopup');if(old)old.remove();goProfile();},450);}requestAnimationFrame(animate);};const btn=document.getElementById('spinBtn');if(btn){btn.disabled=false;btn.textContent='SPIN! 🎡';btn.onclick=startSpin;}
}catch(e){const btn=document.getElementById('spinBtn');if(btn){btn.disabled=false;btn.textContent='SPIN! 🎡';}console.warn('V14 spin patch failed:',e.message);}})();
    `);

    const spinBtn=doc.getElementById('spinBtn');
    if(spinBtn&&spinBtn.textContent.includes('SPIN')) spinBtn.disabled=false;
    try{win.setRegGender(win.regGender||'boy');}catch(e){}
    loader.style.display='none';
    return true;
  }

  frame.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      tries++;
      const ok=patchGame();
      if(ok||tries>40) clearInterval(timer);
      if(tries>40) loader.innerHTML='<div class="box"><div class="panda">⚠️</div><div class="title">Unable to patch game</div><div class="msg">Please refresh and try again.</div></div>';
    },250);
  });
})();
</script>
</body>
</html>
