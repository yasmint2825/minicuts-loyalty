<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MiniCuts Game Zone - V16 Roadmap</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D47A1;font-family:Arial,sans-serif}#gameFrame{border:0;width:100vw;height:100vh;display:block;background:#0D47A1}#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D47A1;color:#fff;z-index:999999;text-align:center}#loader .box{background:rgba(255,255,255,.12);border-radius:18px;padding:24px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25)}#loader .panda{font-size:54px;margin-bottom:10px}#loader .title{font-size:22px;font-weight:800;color:#FFD600;margin-bottom:8px}#loader .msg{font-size:14px;line-height:1.5;opacity:.9}
</style>
</head>
<body>
<div id="loader"><div class="box"><div class="panda">🐼</div><div class="title">Loading MiniCuts Game...</div><div class="msg">V16 roadmap progress version</div></div></div>
<iframe id="gameFrame" src="./minicuts-game-V10.html?v=27"></iframe>
<script>
(function(){
  const frame=document.getElementById('gameFrame');
  const loader=document.getElementById('loader');
  frame.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      tries++;
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;
        if(!doc||!doc.body)return;
        if(!doc.getElementById('v16PatchScript')){
          const s=doc.createElement('script');
          s.id='v16PatchScript';
          s.src='./minicuts-game-patch-V16.js?v=1';
          doc.body.appendChild(s);
        }
        loader.style.display='none';
        clearInterval(timer);
      }catch(e){
        if(tries>40){
          clearInterval(timer);
          loader.innerHTML='<div class="box"><div class="panda">⚠️</div><div class="title">Unable to load patch</div><div class="msg">Please refresh and try again.</div></div>';
        }
      }
    },250);
  });
})();
</script>
</body>
</html>
